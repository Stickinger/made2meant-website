<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Konto — made2meant</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    .nav-icons { display: flex; align-items: center; gap: 18px; }
    .nav-icons a { color: var(--color-text); display: inline-flex; }
    .nav-icons a:hover { color: var(--color-primary); }
    .nav-icons svg { width: 21px; height: 21px; }

    .account-layout { display: grid; grid-template-columns: 230px 1fr; gap: 40px; padding: 40px 0 70px; }
    .account-nav { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 8px; height: fit-content; position: sticky; top: 88px; }
    .account-nav a { display: block; padding: 11px 14px; border-radius: var(--radius); color: var(--color-muted); font-size: 0.92rem; font-weight: 600; transition: all var(--transition); cursor: pointer; }
    .account-nav a:hover, .account-nav a.active { background: var(--color-surface-2); color: var(--color-text); text-decoration: none; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .order-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 20px 22px; margin-bottom: 14px; cursor: pointer; transition: box-shadow var(--transition), border-color var(--transition); }
    .order-card:hover { box-shadow: var(--shadow); border-color: #d9cfc0; }
    .order-card__header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
    .order-card__id { font-weight: 800; font-family: var(--font-main); }
    .order-card__date { color: var(--color-muted); font-size: 0.85rem; margin-left: 10px; }
    .order-card__items { color: var(--color-muted); font-size: 0.9rem; }
    .order-card__foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .order-card__total { font-weight: 800; }
    .order-card__link { color: var(--color-primary); font-size: 0.85rem; font-weight: 700; }

    .status-badge { font-size: 0.72rem; font-weight: 700; padding: 4px 12px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    .status-pending   { background: rgba(197,106,71,0.14);  color: #b25a38; }
    .status-processing{ background: rgba(110,141,122,0.16); color: #55705f; }
    .status-shipped   { background: rgba(110,141,122,0.16); color: #55705f; }
    .status-delivered { background: rgba(110,141,122,0.20); color: #46604f; }
    .status-cancelled { background: rgba(120,120,120,0.14); color: #77706a; }

    /* Modal */
    .omodal { position: fixed; inset: 0; background: rgba(28,24,20,0.5); display: none; align-items: flex-start; justify-content: center; z-index: 1000; padding: 40px 16px; overflow-y: auto; }
    .omodal.open { display: flex; }
    .omodal__box { background: var(--color-bg); border-radius: var(--radius-lg); width: 100%; max-width: 620px; box-shadow: var(--shadow-lg); }
    .omodal__head { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px; border-bottom: 1px solid var(--color-border); }
    .omodal__close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--color-muted); line-height: 1; }
    .omodal__body { padding: 22px 24px; }
    .omodal__sec { margin-bottom: 22px; }
    .omodal__sec h4 { font-family: var(--font-main); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 10px; }
    .oitem { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--color-border); font-size: 0.92rem; }
    .oitem:last-child { border-bottom: none; }
    .oitem__opts { color: var(--color-muted); font-size: 0.82rem; margin-top: 3px; }
    .osum { display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 6px; }
    .osum--total { font-weight: 800; font-size: 1.05rem; border-top: 1px solid var(--color-border); padding-top: 10px; margin-top: 8px; }
    .oactions { display: flex; gap: 10px; flex-wrap: wrap; }
    .oactions .btn { font-size: 0.85rem; padding: 10px 18px; }

    .panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 18px; margin-top: 14px; display: none; }
    .panel.open { display: block; }
    .panel h4 { margin-bottom: 12px; }
    .bank-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--color-border); font-size: 0.9rem; }
    .bank-row:last-child { border-bottom: none; }
    .bank-row strong { font-family: var(--font-main); }
    .form-mini label { display: block; font-size: 0.8rem; color: var(--color-muted); margin-bottom: 4px; }
    .form-mini input, .form-mini select, .form-mini textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--color-border); border-radius: var(--radius); font-family: var(--font-main); font-size: 0.92rem; background: #fff; color: var(--color-text); margin-bottom: 12px; }
    .form-mini .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    @media (max-width: 640px) {
      .account-layout { grid-template-columns: 1fr; }
      .account-nav { position: static; display: flex; flex-wrap: wrap; gap: 4px; }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="/index.html" class="navbar__logo">made2meant</a>
      <ul class="navbar__links">
        <li><a href="/shop.html">Shop</a></li>
        <li><a href="/ueber-uns.html">Über uns</a></li>
      </ul>
      <div class="nav-icons">
        <a href="/account.html" aria-label="Mein Konto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></a>
        <button class="btn btn--ghost" style="padding:0;font-size:0.85rem" onclick="logout()">Logout</button>
        <a href="/cart.html" class="cart-icon" aria-label="Warenkorb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v13a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> <span id="cart-badge" style="display:none">0</span></a>
      </div>
    </div>
  </nav>

  <main id="main">
    <div class="container">
      <div class="account-layout">
        <nav class="account-nav">
          <a class="active" onclick="showTab('orders', this)">Bestellungen</a>
          <a onclick="showTab('profile', this)">Profil</a>
          <a onclick="showTab('address', this)">Adresse</a>
        </nav>

        <div>
          <div style="margin-bottom:28px;">
            <h1>Mein Konto</h1>
            <p id="user-email" style="color:var(--color-muted); margin-top:4px;"></p>
          </div>

          <div id="tab-orders" class="tab-panel active">
            <h2 style="margin-bottom:22px;">Meine Bestellungen</h2>
            <div id="orders-list"><p class="loading">Bestellungen werden geladen…</p></div>
          </div>

          <div id="tab-profile" class="tab-panel">
            <h2 style="margin-bottom:22px;">Profil bearbeiten</h2>
            <form id="profile-form" style="max-width:480px;">
              <div class="form-group"><label>Vollständiger Name</label><input type="text" id="profile-name" placeholder="Max Mustermann"></div>
              <div class="form-group"><label>E-Mail</label><input type="email" id="profile-email" disabled style="opacity:0.5;cursor:not-allowed;"><small style="color:var(--color-muted);">E-Mail kann nicht geändert werden.</small></div>
              <div class="form-error" id="profile-error"></div>
              <button type="submit" class="btn btn--primary" style="width:auto; margin-top:8px;">Speichern</button>
            </form>
          </div>

          <div id="tab-address" class="tab-panel">
            <h2 style="margin-bottom:22px;">Standard-Lieferadresse</h2>
            <form id="address-form" style="max-width:480px;">
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                <div class="form-group"><label>Vorname</label><input type="text" id="addr-first-name"></div>
                <div class="form-group"><label>Nachname</label><input type="text" id="addr-last-name"></div>
              </div>
              <div class="form-group"><label>Straße & Hausnummer</label><input type="text" id="addr-street"></div>
              <div style="display:grid; grid-template-columns:120px 1fr; gap:16px;">
                <div class="form-group"><label>PLZ</label><input type="text" id="addr-zip"></div>
                <div class="form-group"><label>Stadt</label><input type="text" id="addr-city"></div>
              </div>
              <div class="form-group"><label>Land</label><select id="addr-country"><option value="AT">Österreich</option><option value="DE">Deutschland</option><option value="CH">Schweiz</option></select></div>
              <div class="form-error" id="address-error"></div>
              <button type="submit" class="btn btn--primary" style="width:auto; margin-top:8px;">Adresse speichern</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bestell-Detail-Modal -->
  <div class="omodal" id="omodal">
    <div class="omodal__box">
      <div class="omodal__head">
        <h3 id="om-title">Bestellung</h3>
        <button class="omodal__close" onclick="closeOrder()" aria-label="Schließen">✕</button>
      </div>
      <div class="omodal__body" id="om-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    // ── Bankdaten für Vorkasse — hier deine echten Daten eintragen ──
    const BANK = { empfaenger: 'made2meant', iban: '', bic: '', bank: '' };

    const STATUS_LABELS = { pending:'Ausstehend', processing:'In Bearbeitung', shipped:'Versendet', delivered:'Zugestellt', cancelled:'Storniert' };
    const isPending = s => s === 'pending';
    const isPaid    = s => ['processing','shipped','delivered'].includes(s);
    const canEditAddr = s => ['pending','processing'].includes(s);

    const orderMap = {};
    let currentUser = null;

    function euro(n) { return '€ ' + Number(n || 0).toFixed(2).replace('.', ','); }
    function shortId(id) { return '#' + id.slice(0, 8).toUpperCase(); }
    function fmtDate(d) { return new Date(d).toLocaleDateString('de-AT'); }
    function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function showTab(name, link) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.account-nav a').forEach(a => a.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      if (link) link.classList.add('active');
    }

    async function loadOrders(userId) {
      const { data, error } = await db.from('orders')
        .select('*, order_items(*)').eq('user_id', userId).order('created_at', { ascending: false });
      const list = document.getElementById('orders-list');
      if (error || !data || data.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:50px 0;"><p style="color:var(--color-muted);">Du hast noch keine Bestellungen.</p><a href="/shop.html" class="btn btn--primary" style="width:auto; margin-top:20px;">Jetzt entdecken</a></div>`;
        return;
      }
      data.forEach(o => orderMap[o.id] = o);
      list.innerHTML = data.map(o => `
        <div class="order-card" onclick="openOrder('${o.id}')">
          <div class="order-card__header">
            <div><span class="order-card__id">${shortId(o.id)}</span><span class="order-card__date">${fmtDate(o.created_at)}</span></div>
            <span class="status-badge status-${o.status}">${STATUS_LABELS[o.status] || o.status}</span>
          </div>
          <div class="order-card__items">${o.order_items.map(i => esc(i.name) + ' × ' + i.quantity).join(' · ')}</div>
          <div class="order-card__foot">
            <span class="order-card__total">${euro(o.total)}</span>
            <span class="order-card__link">Details ansehen →</span>
          </div>
        </div>`).join('');
    }

    function optionsHtml(opts) {
      if (!opts || !Object.keys(opts).length) return '';
      return `<div class="oitem__opts">${Object.entries(opts).map(([k,v]) => esc(k)+': '+esc(String(v))).join(' · ')}</div>`;
    }

    function openOrder(id) {
      const o = orderMap[id];
      if (!o) return;
      document.getElementById('om-title').textContent = 'Bestellung ' + shortId(o.id);

      const items = o.order_items.map(i => `
        <div class="oitem">
          <div><strong>${esc(i.name)}</strong> × ${i.quantity}${optionsHtml(i.options)}</div>
          <div>${euro(i.price * i.quantity)}</div>
        </div>`).join('');

      const addr = `${esc(o.first_name||'')} ${esc(o.last_name||'')}<br>${esc(o.address||'')}<br>${esc(o.zip||'')} ${esc(o.city||'')}<br>${esc(o.country||'')}`;

      // Aktionen je Status
      const actions = [];
      if (isPending(o.status)) actions.push(`<button class="btn btn--primary" onclick="togglePanel('pay')">Bezahlung abschließen</button>`);
      if (isPaid(o.status))    actions.push(`<button class="btn btn--secondary" onclick="printReceipt('${o.id}')">Beleg ansehen / drucken</button>`);
      if (canEditAddr(o.status)) actions.push(`<button class="btn btn--outline" onclick="togglePanel('addr')">Adresse ändern</button>`);
      actions.push(`<button class="btn btn--outline" onclick="togglePanel('rekla')">Problem melden</button>`);
      if (isPending(o.status)) actions.push(`<button class="btn btn--ghost" onclick="cancelOrder('${o.id}')">Stornieren</button>`);

      // Vorkasse-Panel
      const ref = shortId(o.id);
      const bankRows = BANK.iban
        ? `<div class="bank-row"><span>Empfänger</span><strong>${esc(BANK.empfaenger)}</strong></div>
           <div class="bank-row"><span>IBAN</span><strong>${esc(BANK.iban)}</strong></div>
           ${BANK.bic ? `<div class="bank-row"><span>BIC</span><strong>${esc(BANK.bic)}</strong></div>` : ''}
           ${BANK.bank ? `<div class="bank-row"><span>Bank</span><strong>${esc(BANK.bank)}</strong></div>` : ''}
           <div class="bank-row"><span>Betrag</span><strong>${euro(o.total)}</strong></div>
           <div class="bank-row"><span>Verwendungszweck</span><strong>${ref}</strong></div>`
        : `<p style="color:var(--color-muted);font-size:0.9rem;">Die Zahlungsdetails senden wir dir per E-Mail zu. Bitte gib bei der Überweisung die Bestellnummer <strong>${ref}</strong> als Verwendungszweck an.</p>`;

      document.getElementById('om-body').innerHTML = `
        <div class="omodal__sec" style="display:flex;justify-content:space-between;align-items:center;">
          <span style="color:var(--color-muted);font-size:0.88rem;">${fmtDate(o.created_at)}</span>
          <span class="status-badge status-${o.status}">${STATUS_LABELS[o.status] || o.status}</span>
        </div>

        <div class="omodal__sec"><h4>Artikel</h4>${items}</div>

        <div class="omodal__sec"><h4>Lieferadresse</h4><div id="addr-view" style="font-size:0.92rem;line-height:1.6;">${addr}</div></div>

        <div class="omodal__sec"><h4>Summe</h4>
          <div class="osum"><span>Zwischensumme</span><span>${euro(o.subtotal)}</span></div>
          <div class="osum"><span>Versand</span><span>${o.shipping > 0 ? euro(o.shipping) : 'Kostenlos'}</span></div>
          <div class="osum osum--total"><span>Gesamt</span><span>${euro(o.total)}</span></div>
        </div>

        <div class="oactions">${actions.join('')}</div>

        <!-- Vorkasse -->
        <div class="panel" id="panel-pay">
          <h4>Zahlung per Überweisung (Vorkasse)</h4>
          ${bankRows}
          <p style="color:var(--color-muted);font-size:0.82rem;margin-top:12px;">Sobald deine Zahlung eingegangen ist, bearbeiten wir deine Bestellung.</p>
        </div>

        <!-- Adresse ändern -->
        <div class="panel" id="panel-addr">
          <h4>Lieferadresse ändern</h4>
          <div class="form-mini">
            <div class="row2">
              <div><label>Vorname</label><input id="oa-first" value="${esc(o.first_name||'')}"></div>
              <div><label>Nachname</label><input id="oa-last" value="${esc(o.last_name||'')}"></div>
            </div>
            <label>Straße & Hausnummer</label><input id="oa-address" value="${esc(o.address||'')}">
            <div class="row2">
              <div><label>PLZ</label><input id="oa-zip" value="${esc(o.zip||'')}"></div>
              <div><label>Stadt</label><input id="oa-city" value="${esc(o.city||'')}"></div>
            </div>
            <label>Land</label>
            <select id="oa-country">
              <option value="AT" ${o.country==='AT'?'selected':''}>Österreich</option>
              <option value="DE" ${o.country==='DE'?'selected':''}>Deutschland</option>
              <option value="CH" ${o.country==='CH'?'selected':''}>Schweiz</option>
            </select>
            <button class="btn btn--primary" style="font-size:0.85rem;padding:10px 18px;" onclick="saveAddress('${o.id}')">Adresse speichern</button>
          </div>
        </div>

        <!-- Reklamation -->
        <div class="panel" id="panel-rekla">
          <h4>Problem melden / Reklamation</h4>
          <div class="form-mini">
            <label>Betreff</label>
            <input id="rk-subject" placeholder="z.B. Falsche Farbe, beschädigt, Frage zur Lieferung">
            <label>Deine Nachricht</label>
            <textarea id="rk-message" rows="4" placeholder="Beschreib uns kurz, worum es geht — wir kümmern uns."></textarea>
            <button class="btn btn--primary" style="font-size:0.85rem;padding:10px 18px;" onclick="sendComplaint('${o.id}')">Absenden</button>
          </div>
        </div>
      `;
      document.getElementById('omodal').classList.add('open');
    }

    function closeOrder() { document.getElementById('omodal').classList.remove('open'); }
    document.getElementById('omodal').addEventListener('click', e => { if (e.target.id === 'omodal') closeOrder(); });

    function togglePanel(which) {
      ['pay','addr','rekla'].forEach(p => {
        const el = document.getElementById('panel-' + p);
        if (el) el.classList.toggle('open', p === which ? !el.classList.contains('open') : false);
      });
    }

    async function saveAddress(id) {
      const { error } = await db.rpc('update_order_address', {
        p_order: id,
        p_first: document.getElementById('oa-first').value,
        p_last:  document.getElementById('oa-last').value,
        p_address: document.getElementById('oa-address').value,
        p_zip:   document.getElementById('oa-zip').value,
        p_city:  document.getElementById('oa-city').value,
        p_country: document.getElementById('oa-country').value,
      });
      if (error) { showToast('Fehler: ' + error.message); return; }
      showToast('Adresse aktualisiert!');
      await loadOrders(currentUser.id);
      openOrder(id);
    }

    async function cancelOrder(id) {
      if (!confirm('Bestellung wirklich stornieren?')) return;
      const { error } = await db.rpc('cancel_own_order', { p_order: id });
      if (error) { showToast('Fehler: ' + error.message); return; }
      showToast('Bestellung storniert.');
      await loadOrders(currentUser.id);
      openOrder(id);
    }

    async function sendComplaint(id) {
      const subject = document.getElementById('rk-subject').value.trim();
      const message = document.getElementById('rk-message').value.trim();
      if (!message) { showToast('Bitte beschreib dein Anliegen.'); return; }
      const { error } = await db.from('order_complaints').insert({
        order_id: id, user_id: currentUser.id, subject, message,
      });
      if (error) { showToast('Fehler: ' + error.message); return; }
      showToast('Danke! Wir melden uns bei dir.');
      togglePanel('none');
    }

    function printReceipt(id) {
      const o = orderMap[id];
      if (!o) return;
      const rows = o.order_items.map(i => {
        const opts = i.options && Object.keys(i.options).length ? '<br><span style="color:#888;font-size:12px">' + Object.entries(i.options).map(([k,v]) => esc(k)+': '+esc(String(v))).join(' · ') + '</span>' : '';
        return `<tr><td style="padding:6px 0;border-bottom:1px solid #eee">${esc(i.name)}${opts}</td><td style="text-align:center;border-bottom:1px solid #eee">${i.quantity}</td><td style="text-align:right;border-bottom:1px solid #eee">${euro(i.price*i.quantity)}</td></tr>`;
      }).join('');
      const w = window.open('', '_blank', 'width=720,height=900');
      w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Beleg ${shortId(o.id)}</title>
        <style>body{font-family:Arial,sans-serif;color:#2a2724;max-width:640px;margin:40px auto;padding:0 24px}
        h1{color:#C56A47;font-size:26px;margin:0 0 4px}.muted{color:#888;font-size:13px}
        table{width:100%;border-collapse:collapse;margin:18px 0}th{text-align:left;font-size:12px;color:#888;border-bottom:2px solid #eee;padding-bottom:6px}
        .tot{display:flex;justify-content:space-between;font-weight:bold;font-size:16px;border-top:2px solid #eee;padding-top:8px;margin-top:8px}
        .box{margin:16px 0;font-size:14px;line-height:1.6}</style></head><body>
        <h1>made2meant</h1><div class="muted">Made personal. Meant forever.</div>
        <h2 style="margin-top:24px">Beleg ${shortId(o.id)}</h2>
        <div class="muted">Datum: ${fmtDate(o.created_at)} · Status: ${STATUS_LABELS[o.status]||o.status}</div>
        <div class="box"><strong>Lieferadresse</strong><br>${esc(o.first_name||'')} ${esc(o.last_name||'')}<br>${esc(o.address||'')}<br>${esc(o.zip||'')} ${esc(o.city||'')}<br>${esc(o.country||'')}</div>
        <table><tr><th>Artikel</th><th style="text-align:center">Menge</th><th style="text-align:right">Preis</th></tr>${rows}</table>
        <div style="display:flex;justify-content:space-between;font-size:14px"><span>Zwischensumme</span><span>${euro(o.subtotal)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:14px"><span>Versand</span><span>${o.shipping>0?euro(o.shipping):'Kostenlos'}</span></div>
        <div class="tot"><span>Gesamt</span><span>${euro(o.total)}</span></div>
        <p class="muted" style="margin-top:28px">Dies ist ein Bestellbeleg. Vielen Dank für deinen Einkauf bei made2meant.</p>
        <script>window.onload=function(){window.print()}<\/script></body></html>`);
      w.document.close();
    }

    async function loadProfile(user) {
      document.getElementById('profile-email').value = user.email;
      document.getElementById('profile-name').value = user.user_metadata?.full_name || '';
      document.getElementById('user-email').textContent = user.email;
      const { data } = await db.from('profiles').select('*').eq('id', user.id).single();
      if (data) {
        document.getElementById('addr-first-name').value = data.first_name || '';
        document.getElementById('addr-last-name').value  = data.last_name  || '';
        document.getElementById('addr-street').value     = data.street     || '';
        document.getElementById('addr-zip').value        = data.zip        || '';
        document.getElementById('addr-city').value       = data.city       || '';
        document.getElementById('addr-country').value    = data.country    || 'AT';
      }
    }

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      currentUser = user;
      updateCartBadge();
      loadOrders(user.id);
      loadProfile(user);

      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const { error } = await db.auth.updateUser({ data: { full_name: document.getElementById('profile-name').value } });
        const err = document.getElementById('profile-error');
        if (error) { err.textContent = 'Fehler beim Speichern.'; err.classList.add('visible'); }
        else showToast('Profil gespeichert!');
      });

      document.getElementById('address-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const { error } = await db.from('profiles').upsert({
          id: user.id,
          first_name: document.getElementById('addr-first-name').value,
          last_name:  document.getElementById('addr-last-name').value,
          street:     document.getElementById('addr-street').value,
          zip:        document.getElementById('addr-zip').value,
          city:       document.getElementById('addr-city').value,
          country:    document.getElementById('addr-country').value,
        });
        const err = document.getElementById('address-error');
        if (error) { err.textContent = 'Fehler beim Speichern.'; err.classList.add('visible'); }
        else showToast('Adresse gespeichert!');
      });
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2600);
    }

    init();
  </script>

</body>
</html>
