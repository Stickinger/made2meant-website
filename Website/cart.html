<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F57A45">
  <title>Warenkorb — MADE2MEANT</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://xqeedhnajvftvcsjzfly.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://xqeedhnajvftvcsjzfly.supabase.co">
  <style>
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 40px;
      align-items: start;
      padding: 60px 0;
    }
    .cart-item-img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--color-border);
    }
    .qty-input {
      width: 60px;
      text-align: center;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      color: var(--color-text);
      padding: 6px;
      font-size: 1rem;
    }
    .remove-btn {
      background: none;
      border: none;
      color: var(--color-muted);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px 8px;
    }
    .remove-btn:hover { color: var(--color-danger); }
    .cart-empty {
      text-align: center;
      padding: 80px 0;
    }
    .cart-empty p { color: var(--color-muted); margin-bottom: 24px; }
    @media (max-width: 768px) {
      .cart-layout { grid-template-columns: 1fr; }
    }
    .disc-box { display: flex; gap: 8px; margin: 16px 0 4px; }
    .disc-box input { flex: 1; text-transform: uppercase; letter-spacing: 0.04em; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius); color: var(--color-text); padding: 9px 10px; font-size: 0.9rem; }
    .disc-box input::placeholder { text-transform: none; letter-spacing: normal; }
    .disc-box button { padding: 0 14px; white-space: nowrap; font-size: 0.85rem; }
    .disc-msg { font-size: 0.8rem; min-height: 1.1em; margin: 2px 0 4px; }
    .disc-remove { background: none; border: none; color: var(--color-muted); font-size: 0.78rem; cursor: pointer; padding: 0; text-decoration: underline; }
    .disc-remove:hover { color: var(--color-danger); }
    .ship-progress { margin: 4px 0 12px; }
    .ship-progress__track { height: 7px; background: var(--color-border); border-radius: 99px; overflow: hidden; }
    .ship-progress__fill { height: 100%; background: var(--color-primary); border-radius: 99px; transition: width .4s ease; }
    .ship-progress__label { display: block; font-size: 0.8rem; color: var(--color-muted); margin-top: 7px; }
    .ship-progress__label--done { color: var(--color-success); font-weight: 600; }

    /* Popup: Vorschläge für kostenlosen Versand */
    .shipmodal-overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: rgba(28,28,28,0.55); opacity: 0; visibility: hidden; transition: opacity .3s ease; }
    .shipmodal-overlay.show { opacity: 1; visibility: visible; }
    .shipmodal { position: relative; width: 100%; max-width: 440px; max-height: 86vh; overflow-y: auto;
      background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: 0 24px 70px rgba(28,28,28,.28);
      padding: 30px 26px; transform: translateY(14px) scale(.98); transition: transform .3s ease; }
    .shipmodal-overlay.show .shipmodal { transform: none; }
    .shipmodal__close { position: absolute; top: 10px; right: 12px; width: 32px; height: 32px; border: none;
      background: transparent; cursor: pointer; color: var(--color-muted); font-size: 22px; line-height: 1; border-radius: 50%; }
    .shipmodal__close:hover { background: rgba(0,0,0,.05); color: var(--color-text); }
    .shipmodal h3 { margin-bottom: 6px; }
    .shipmodal .shipmodal__sub { color: var(--color-muted); font-size: 0.88rem; margin-bottom: 18px; }
    .shipmodal__track { height: 7px; background: var(--color-border); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
    .shipmodal__fill { height: 100%; background: var(--color-primary); border-radius: 99px; }
    .shipitem { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--color-border); }
    .shipitem:first-of-type { border-top: none; padding-top: 0; }
    .shipitem img, .shipitem__ph { width: 52px; height: 52px; border-radius: 10px; object-fit: cover;
      background: linear-gradient(140deg,#EFE7DA,#E1CDB2); flex: 0 0 auto; }
    .shipitem__info { flex: 1; min-width: 0; }
    .shipitem__name { font-weight: 600; font-size: 0.9rem; }
    .shipitem__price { color: var(--color-muted); font-size: 0.82rem; }
    .shipitem__add { flex: 0 0 auto; padding: 7px 14px; font-size: 0.78rem; white-space: nowrap; }
  </style>
  <link rel="stylesheet" href="/css/design-v2.css">
  <script src="/js/consent.js" defer></script>
</head>
<body>


  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="/index.html" class="navbar__logo">MADE2<span>MEANT</span></a>
      <ul class="navbar__links">
        <li><a href="/index.html">← Weiter shoppen</a></li>
        <li><a href="/cart.html" class="cart-icon" aria-label="Warenkorb"><span aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v13a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span> <span id="cart-badge" style="display:none">0</span></a></li>
      </ul>
    </div>
  </nav>

  <main id="main">
    <div class="container">
      <div id="cart-content"></div>
    </div>
  </main>

  <div class="shipmodal-overlay" id="shipmodal-overlay">
    <div class="shipmodal" role="dialog" aria-modal="true" aria-label="Vorschläge für kostenlosen Versand">
      <button type="button" class="shipmodal__close" id="shipmodal-close" aria-label="Schließen">&times;</button>
      <div id="shipmodal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/products.js"></script>
  <script>
    let discNotice = ''; // Meldung, die nach dem Neu-Rendern angezeigt wird
    let cartKeys = [];   // Schlüssel je Zeile (Optionen können ' oder " enthalten)

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function renderCart() {
      const cart = getCart();
      const content = document.getElementById('cart-content');

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="cart-empty">
            <div style="margin-bottom:20px; color:var(--color-muted);"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v13a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
            <h2>Dein Warenkorb ist leer</h2>
            <p>Schau dich im Shop um und füge Produkte hinzu.</p>
            <a href="/index.html" class="btn btn--primary" style="width:auto">Zum Shop</a>
          </div>
        `;
        return;
      }

      cartKeys = cart.map(item => item.key || item.id);
      const rows = cart.map((item, idx) => `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:12px;">
              <img src="${esc(item.image_url || '/assets/images/placeholder.png')}"
                   alt="${esc(item.name)}" class="cart-item-img">
              <div>
                <strong>${esc(item.name)}</strong><br>
                ${item.options && Object.keys(item.options).length ? `
                  <span style="color:var(--color-muted); font-size:0.8rem;">
                    ${Object.entries(item.options).map(([k,v]) => `${esc(k)}: ${esc(v)}`).join(' · ')}
                  </span><br>` : ''}
                <span style="color:var(--color-muted); font-size:0.85rem;">
                  €${item.price.toFixed(2)} / Stück
                </span>
              </div>
            </div>
          </td>
          <td>
            <input
              type="number"
              class="qty-input"
              value="${item.quantity}"
              min="1"
              aria-label="Menge für ${esc(item.name)}"
              onchange="handleQtyChange(${idx}, this.value)"
            >
          </td>
          <td><strong>€${(item.price * item.quantity).toFixed(2)}</strong></td>
          <td>
            <button class="remove-btn" onclick="handleRemove(${idx})" title="Entfernen" aria-label="${esc(item.name)} entfernen">✕</button>
          </td>
        </tr>
      `).join('');

      const total = getCartTotal();
      const disc = await resolveDiscount(total);
      if (disc.error) discNotice = disc.error;
      const shipping = total >= 119 ? 0 : 3.90;
      const grandTotal = Math.max(0, total - disc.amount) + shipping;
      const noticeColor = disc.amount > 0 ? 'var(--color-success)' : 'var(--color-danger)';
      const notice = discNotice;
      discNotice = '';

      content.innerHTML = `
        <div class="cart-layout">
          <div>
            <h1 style="margin-bottom:32px;">Warenkorb</h1>
            <table class="cart-table">
              <thead>
                <tr>
                  <th>Produkt</th>
                  <th>Menge</th>
                  <th>Preis</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
            <button class="btn btn--ghost" onclick="handleClearCart()" style="margin-top:8px;">
              Warenkorb leeren
            </button>
          </div>

          <div class="cart-summary">
            <h3 style="margin-bottom:20px;">Zusammenfassung</h3>
            <div class="cart-summary__row">
              <span>Zwischensumme</span>
              <span>€${total.toFixed(2)}</span>
            </div>
            ${disc.amount > 0 ? `
              <div class="cart-summary__row" style="color:var(--color-success)">
                <span>Rabatt (${esc(disc.code)})</span>
                <span>−€${disc.amount.toFixed(2)}</span>
              </div>` : ''}
            <div class="disc-box">
              <input type="text" id="cart-disc-input" placeholder="Rabattcode" autocomplete="off"
                     value="${esc(disc.code || '')}"
                     oninput="this.value=this.value.toUpperCase()"
                     onkeydown="if(event.key==='Enter'){event.preventDefault();applyCartDiscount();}">
              <button type="button" class="btn btn--ghost" onclick="applyCartDiscount()">${disc.amount > 0 ? 'Ändern' : 'Einlösen'}</button>
            </div>
            ${notice ? `<div class="disc-msg" style="color:${noticeColor}">${esc(notice)}</div>` : '<div class="disc-msg"></div>'}
            ${disc.amount > 0 ? `<button class="disc-remove" onclick="removeCartDiscount()">Rabatt entfernen</button>` : ''}
            <div class="cart-summary__row" style="margin-top:12px;">
              <span>Versand</span>
              <span>${shipping === 0 ? '<span style="color:var(--color-success)">Kostenlos</span>' : '€' + shipping.toFixed(2)}</span>
            </div>
            <div class="ship-progress">
              <div class="ship-progress__track"><div class="ship-progress__fill" style="width:${Math.min(100, total / 119 * 100).toFixed(0)}%"></div></div>
              ${shipping > 0
                ? `<span class="ship-progress__label">Noch <strong>€${(119 - total).toFixed(2)}</strong> bis zum kostenlosen Versand</span>`
                : `<span class="ship-progress__label ship-progress__label--done">Geschafft – du erhältst kostenlosen Versand!</span>`}
            </div>
            <div class="cart-summary__row cart-summary__row--total">
              <span>Gesamt</span>
              <span>€${grandTotal.toFixed(2)}</span>
            </div>
            <a href="/checkout.html" class="btn btn--primary" style="display:block; margin-top:20px; text-align:center;">
              Zur Kasse →
            </a>
            <a href="/index.html" class="btn btn--outline" style="display:block; margin-top:10px; text-align:center;">
              Weiter shoppen
            </a>
          </div>
        </div>
      `;
    }

    function handleQtyChange(idx, value) {
      const key = cartKeys[idx];
      const qty = parseInt(value);
      if (qty > 0) updateQuantity(key, qty);
      else removeFromCart(key);
      renderCart();
    }

    function handleRemove(idx) {
      removeFromCart(cartKeys[idx]);
      renderCart();
    }

    function handleClearCart() {
      if (confirm('Warenkorb wirklich leeren?')) {
        clearCart();
        renderCart();
      }
    }

    async function applyCartDiscount() {
      const input = document.getElementById('cart-disc-input');
      const code = (input.value || '').trim().toUpperCase();
      if (!code) { removeCartDiscount(); return; }
      const { data, error } = await db.rpc('validate_discount', { p_code: code, p_subtotal: getCartTotal() });
      if (error) { discNotice = 'Prüfung fehlgeschlagen. Bitte später erneut versuchen.'; return renderCart(); }
      if (!data || !data.valid) {
        clearDiscount();
        discNotice = (data && data.message) || 'Code ungültig.';
        return renderCart();
      }
      setDiscountCode(data.code);
      discNotice = 'Code „' + data.code + '“ angewendet: −€' + Number(data.amount).toFixed(2);
      renderCart();
    }

    function removeCartDiscount() {
      clearDiscount();
      discNotice = '';
      renderCart();
    }

    // ── POPUP: Vorschläge für kostenlosen Versand ──────────────
    // Zeigt einmal pro Browser-Sitzung Produkte, mit denen die Lücke
    // zu 119 € geschlossen werden kann — am liebsten eines, das allein
    // reicht, sonst die teuersten darunter zum Kombinieren.
    const SHIP_POPUP_KEY = 'shipmodal_dismissed';
    let shipSuggestions = [];

    function euroCart(n) { return '€' + Number(n || 0).toFixed(2).replace('.', ','); }

    async function maybeShowShippingModal() {
      const total = getCartTotal();
      if (total <= 0 || total >= FREE_SHIPPING_THRESHOLD) return; // leer oder schon kostenlos
      try { if (sessionStorage.getItem(SHIP_POPUP_KEY)) return; } catch (e) {}

      const products = await loadProducts();
      if (!products.length) return;
      const inCart = new Set(getCart().map(i => i.id));
      const remaining = FREE_SHIPPING_THRESHOLD - total;
      const candidates = products.filter(p => !inCart.has(p.id) && p.stock > 0);

      const closers = candidates.filter(p => p.price >= remaining).sort((a, b) => a.price - b.price);
      const fillers = candidates.filter(p => p.price < remaining).sort((a, b) => b.price - a.price);
      const suggestions = [...closers, ...fillers].slice(0, 3);
      if (!suggestions.length) return;

      renderShippingModal(remaining, suggestions);
      openShippingModal();
    }

    function shipItemRow(p, idx) {
      const img = p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}">` : `<div class="shipitem__ph"></div>`;
      return `
        <div class="shipitem">
          ${img}
          <div class="shipitem__info">
            <div class="shipitem__name">${esc(p.name)}</div>
            <div class="shipitem__price">${euroCart(p.price)}</div>
          </div>
          <button type="button" class="btn btn--ghost shipitem__add" onclick="addShipSuggestion(${idx})">+ Hinzufügen</button>
        </div>`;
    }

    function renderShippingModal(remaining, suggestions) {
      shipSuggestions = suggestions;
      document.getElementById('shipmodal-body').innerHTML = `
        <h3>Fast geschafft!</h3>
        <p class="shipmodal__sub">Noch <strong>${euroCart(remaining)}</strong> bis zum kostenlosen Versand. Wie wär's mit einem dieser Stücke?</p>
        <div class="shipmodal__track"><div class="shipmodal__fill" style="width:${Math.min(100, getCartTotal() / FREE_SHIPPING_THRESHOLD * 100).toFixed(0)}%"></div></div>
        <div id="shipmodal-list">${suggestions.map(shipItemRow).join('')}</div>`;
    }

    function addShipSuggestion(idx) {
      const p = shipSuggestions[idx];
      if (!p) return;
      addToCart(p);
      closeShippingModal();
      renderCart();
    }

    function openShippingModal() {
      document.getElementById('shipmodal-overlay').classList.add('show');
      try { sessionStorage.setItem(SHIP_POPUP_KEY, '1'); } catch (e) {}
    }
    function closeShippingModal() {
      document.getElementById('shipmodal-overlay').classList.remove('show');
    }
    document.getElementById('shipmodal-close').addEventListener('click', closeShippingModal);
    document.getElementById('shipmodal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'shipmodal-overlay') closeShippingModal();
    });

    updateCartBadge();
    renderCart();
    maybeShowShippingModal();
  </script>

</body>
</html>
