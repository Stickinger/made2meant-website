<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produkt — MADE2MEANT</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@400;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── PRODUCT LAYOUT ── */
    .product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      padding: 60px 0 80px;
      align-items: start;
    }

    /* ── LEFT: STICKY CANVAS ── */
    .product-visual {
      position: sticky;
      top: 90px;
    }
    .product-canvas-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      background: white;
      border: 1px solid var(--color-border);
    }
    .product-canvas-wrap canvas {
      width: 100%;
      height: auto;
      display: block;
      touch-action: none;   /* Ziehen auf dem Bild, ohne dass die Seite scrollt */
      cursor: grab;
    }
    .product-canvas-wrap canvas:active { cursor: grabbing; }
    .canvas-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--color-muted);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px;
      border-top: 1px solid var(--color-border);
    }

    /* ── RIGHT: INFO + CONFIGURATOR ── */
    .product-info { display: flex; flex-direction: column; gap: 0; }

    .product-info__header { margin-bottom: 24px; }
    .product-info__category {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-bottom: 8px;
    }
    .product-info__title { font-size: 2rem; margin-bottom: 12px; line-height: 1.2; }
    .product-info__price { font-size: 1.8rem; font-weight: 900; color: var(--color-primary); margin-bottom: 12px; }
    .product-info__desc { color: var(--color-muted); line-height: 1.8; font-size: 0.95rem; margin-bottom: 16px; }
    .product-info__stock { font-size: 0.82rem; color: var(--color-muted); }
    .product-info__stock.low { color: #e07b2a; }

    /* ── CONFIGURATOR ── */
    .configurator-section {
      margin-top: 32px;
      border-top: 1px solid var(--color-border);
      padding-top: 32px;
    }
    .configurator-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .configurator-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    /* Config blocks */
    .config-block { margin-bottom: 28px; }
    .config-block__title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text);
      margin-bottom: 12px;
    }

    /* Position pills */
    .position-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .position-pill {
      padding: 8px 16px;
      border: 1.5px solid var(--color-border);
      border-radius: 99px;
      font-family: var(--font-main);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      background: white;
      color: var(--color-text);
      transition: all 0.15s;
    }
    .position-pill:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .position-pill.selected { background: var(--color-text); border-color: var(--color-text); color: #F2EDDC; }

    /* Content tabs */
    .content-tabs {
      display: flex;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }
    .content-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-family: var(--font-main);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: white;
      border: none;
      color: var(--color-muted);
      transition: all 0.15s;
    }
    .content-tab.active { background: var(--color-text); color: #F2EDDC; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Text input */
    .text-row { display: flex; flex-direction: column; gap: 10px; }
    .text-row input {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 11px 14px;
      font-family: var(--font-main);
      font-size: 0.95rem;
      color: var(--color-text);
      background: white;
      transition: border-color 0.2s;
    }
    .text-row input:focus { border-color: var(--color-primary); }
    .char-count { text-align: right; font-size: 0.72rem; color: var(--color-muted); }
    .char-count.warn { color: var(--color-primary); }

    /* Font pills */
    .font-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .font-pill {
      padding: 7px 14px;
      border: 1.5px solid var(--color-border);
      border-radius: 99px;
      cursor: pointer;
      background: white;
      font-size: 0.78rem;
      transition: all 0.15s;
      font-family: var(--font-main);
      color: var(--color-text);
    }
    .font-pill:hover { border-color: var(--color-primary); }
    .font-pill.selected { background: var(--color-text); border-color: var(--color-text); color: #F2EDDC; }

    /* Symbol grid */
    .symbol-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .symbol-btn {
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius);
      padding: 12px 6px 8px;
      text-align: center;
      cursor: pointer;
      background: white;
      transition: all 0.15s;
      font-size: 1.3rem;
      line-height: 1;
      width: 100%;
    }
    .symbol-btn:hover { border-color: var(--color-primary); }
    .symbol-btn.selected { border-color: var(--color-primary); background: #fdf8f7; }
    .symbol-btn__name {
      display: block;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-top: 4px;
      font-family: var(--font-main);
    }

    /* Color swatches */
    .color-swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .color-swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: var(--font-main);
    }
    .color-swatch__circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      transition: all 0.15s;
    }
    .color-swatch:hover .color-swatch__circle { transform: scale(1.12); }
    .color-swatch.selected .color-swatch__circle {
      border-color: var(--color-text);
      box-shadow: 0 0 0 2px var(--color-bg), 0 0 0 4px var(--color-text);
    }
    .color-swatch__name {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    /* CTA */
    .product-cta { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .qty-selector { display: flex; align-items: center; gap: 12px; }
    .qty-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: white; border: 1px solid var(--color-border);
      color: var(--color-text); font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s;
    }
    .qty-btn:hover { border-color: var(--color-primary); }
    #qty-display { font-size: 1rem; font-weight: 700; min-width: 24px; text-align: center; }

    .personalize-hint {
      font-size: 0.78rem;
      color: var(--color-muted);
      padding: 10px 14px;
      background: #fdf8f7;
      border-radius: var(--radius);
      border: 1px solid #f0e4e2;
    }
    .personalize-hint.complete {
      background: #f0f7f2;
      border-color: #c8dece;
      color: var(--color-accent);
    }

    @media (max-width: 768px) {
      .product-detail { grid-template-columns: 1fr; gap: 32px; }
      .product-visual { position: static; }
      .symbol-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>


  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="/index.html" class="navbar__logo">MADE2<span>MEANT</span></a>
      <ul class="navbar__links">
        <li><a href="/index.html">← Shop</a></li>
        <li><a href="/login.html" id="nav-login">Login</a></li>
        <li><a href="/account.html" id="nav-account" style="display:none">Mein Konto</a></li>
        <li><button class="btn btn--ghost" id="nav-logout" style="display:none" onclick="logout()">Logout</button></li>
        <li><a href="/cart.html" class="cart-icon" aria-label="Warenkorb"><span aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v13a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span> <span id="cart-badge" style="display:none">0</span></a></li>
      </ul>
    </div>
  </nav>

  <main id="main">
    <div class="container">
      <div id="product-detail" class="product-detail">
        <p class="loading">Produkt wird geladen...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="footer__copy">© 2026 MADE2MEANT. Alle Rechte vorbehalten.</span>
      <ul class="footer__links">
        <li><a href="/impressum.html">Impressum</a></li>
        <li><a href="/datenschutz.html">Datenschutz</a></li>
        <li><a href="/agb.html">AGB</a></li>
      </ul>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/products.js"></script>

  <script>
    updateNav();
    updateCartBadge();

    // ── DATA ──────────────────────────────────────────────────

    const PRODUCT_POSITIONS = {
      polster:    ['Mitte', 'Ecke oben links', 'Ecke oben rechts', 'Ecke unten rechts'],
      handtuch:   ['Ecke', 'Bordüre', 'Mitte'],
      bademantel: ['Brust links', 'Rücken', 'Ärmel'],
      saunatuch:  ['Ecke', 'Bordüre oben', 'Mitte'],
      generic:    ['Mitte', 'Ecke oben links', 'Ecke oben rechts'],
    };

    const POSITION_COORDS = {
      'Mitte':            { x: 0.5,  y: 0.5  },
      'Ecke oben links':  { x: 0.2,  y: 0.22 },
      'Ecke oben rechts': { x: 0.78, y: 0.22 },
      'Ecke unten rechts':{ x: 0.78, y: 0.78 },
      'Ecke':             { x: 0.2,  y: 0.78 },
      'Bordüre':          { x: 0.5,  y: 0.88 },
      'Bordüre oben':     { x: 0.5,  y: 0.15 },
      'Brust links':      { x: 0.28, y: 0.32 },
      'Rücken':           { x: 0.5,  y: 0.22 },
      'Ärmel':            { x: 0.78, y: 0.42 },
    };

    const PRODUCT_COLORS = {
      polster:    '#EDE8DF',
      handtuch:   '#DFE8E5',
      bademantel: '#E5DFED',
      saunatuch:  '#E8DFDF',
      generic:    '#F2EDDC',
    };

    const PRODUCT_EMOJIS = {
      polster: '🛋️', handtuch: '🏖️', bademantel: '🩱', saunatuch: '🧖', generic: '✦',
    };

    const THREAD_COLORS = [
      { name: 'Weiß',       hex: '#F0EDE8', border: '#ccc' },
      { name: 'Schwarz',    hex: '#1a1a1a' },
      { name: 'Navy',       hex: '#1B2A4A' },
      { name: 'Bordeaux',   hex: '#7B1C2E' },
      { name: 'Terracotta', hex: '#a85d4f' },
      { name: 'Moosgrün',   hex: '#42553d' },
      { name: 'Gold',       hex: '#C9A84C' },
      { name: 'Silber',     hex: '#A8A9AD' },
      { name: 'Rosa',       hex: '#D4789E' },
      { name: 'Hellblau',   hex: '#5B9EC9' },
      { name: 'Beige',      hex: '#C4A882' },
      { name: 'Lila',       hex: '#7B5EA7' },
    ];

    const SYMBOLS = [
      { char: '★', name: 'Stern' },   { char: '♥', name: 'Herz' },
      { char: '✦', name: 'Raute' },   { char: '✿', name: 'Blume' },
      { char: '♦', name: 'Diamant' }, { char: '☽', name: 'Mond' },
      { char: '✈', name: 'Flieger' }, { char: '⚓', name: 'Anker' },
      { char: '♾', name: '∞' },       { char: '☀', name: 'Sonne' },
      { char: '☘', name: 'Klee' },    { char: '✉', name: 'Brief' },
      { char: '⚡', name: 'Blitz' },   { char: '✜', name: 'Kreuz' },
      { char: '❧', name: 'Ranke' },   { char: '❋', name: 'Ornament' },
    ];

    const FONTS = [
      { id: 'source',   name: 'Modern',    family: "'Source Sans 3', sans-serif" },
      { id: 'playfair', name: 'Elegant',   family: "'Playfair Display', serif" },
      { id: 'dancing',  name: 'Verspielt', family: "'Dancing Script', cursive" },
      { id: 'oswald',   name: 'Bold',      family: "'Oswald', sans-serif" },
    ];

    // ── STATE ─────────────────────────────────────────────────

    let currentProduct = null;
    let productType = 'generic';
    let qty = 1;

    const cfg = {
      pos: { x: 0.5, y: 0.45 },   // normierte Position des Textes auf dem Foto (0..1)
      tab: 'text',
      text: '',
      font: FONTS[0],
      symbol: null,
      color: null,
    };

    let productImg = null;      // geladenes Produktfoto für die Vorschau
    let productImgReady = false;

    // ── INIT ──────────────────────────────────────────────────

    async function init() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) { window.location.href = '/index.html'; return; }

      currentProduct = await loadProduct(slug);
      if (!currentProduct) {
        document.getElementById('product-detail').innerHTML = '<p class="empty">Produkt nicht gefunden.</p>';
        return;
      }

      document.title = currentProduct.name + ' — MADE2MEANT';
      productType = detectProductType(currentProduct.name);

      // Produktfoto vorab laden (für die Live-Vorschau auf dem echten Produkt)
      if (currentProduct.image_url) {
        productImg = new Image();
        productImg.crossOrigin = 'anonymous';
        productImg.onload = () => { productImgReady = true; renderCanvas(); };
        productImg.onerror = () => { productImg = null; productImgReady = false; renderCanvas(); };
        productImg.src = currentProduct.image_url;
      }

      renderPage();
    }

    function detectProductType(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('polster') || n.includes('kissen')) return 'polster';
      if (n.includes('handtuch'))   return 'handtuch';
      if (n.includes('bademantel')) return 'bademantel';
      if (n.includes('saunatuch'))  return 'saunatuch';
      return 'generic';
    }

    // ── RENDER ────────────────────────────────────────────────

    function renderPage() {
      const p = currentProduct;
      const stockLabel = p.stock <= 5
        ? `<span class="product-info__stock low">Nur noch ${p.stock} verfügbar</span>`
        : `<span class="product-info__stock">${p.stock} auf Lager</span>`;

      const positions = PRODUCT_POSITIONS[productType] || PRODUCT_POSITIONS.generic;

      document.getElementById('product-detail').innerHTML = `

        <!-- LEFT: CANVAS PREVIEW -->
        <div class="product-visual">
          <div class="product-canvas-wrap">
            <canvas id="cfg-canvas" width="480" height="480" role="img" aria-label="Live-Vorschau deiner Stickerei"></canvas>
          </div>
          <div class="canvas-hint" aria-hidden="true">Zieh deinen Text auf dem Bild an die gewünschte Stelle</div>
        </div>

        <!-- RIGHT: INFO + CONFIGURATOR -->
        <div class="product-info">

          <!-- Product header -->
          <div class="product-info__header">
            <div class="product-info__category">Personalisiertes Geschenk</div>
            <h1 class="product-info__title">${p.name}</h1>
            <div class="product-info__price">€ ${p.price.toFixed(2).replace('.', ',')}</div>
            <p class="product-info__desc">${p.description || ''}</p>
            ${stockLabel}
          </div>

          <!-- CONFIGURATOR -->
          <div class="configurator-section">
            <div class="configurator-label">Personalisieren</div>

            <!-- Text or Symbol -->
            <div class="config-block">
              <div class="config-block__title">Was soll gestickt werden?</div>
              <div class="content-tabs">
                <button class="content-tab active" id="tab-text" aria-pressed="true" onclick="switchTab('text')">Text</button>
                <button class="content-tab" id="tab-symbol" aria-pressed="false" onclick="switchTab('symbol')">Symbol</button>
              </div>

              <div class="tab-panel active" id="panel-text">
                <div class="text-row">
                  <input type="text" id="custom-text" maxlength="20"
                    placeholder="z.B. Familie Müller, Max, 2026 ..."
                    aria-label="Dein Text für die Stickerei (max. 20 Zeichen)"
                    oninput="onTextInput(this)">
                  <div class="char-count" id="char-count">0 / 20</div>
                  <div class="font-pills" id="font-pills">
                    ${FONTS.map(f => `
                      <button class="font-pill ${f.id === 'source' ? 'selected' : ''}"
                              style="font-family:${f.family}"
                              onclick="selectFont('${f.id}')">${f.name}</button>
                    `).join('')}
                  </div>
                </div>
              </div>

              <div class="tab-panel" id="panel-symbol">
                <div class="symbol-grid" id="symbol-grid">
                  ${SYMBOLS.map(s => `
                    <button type="button" class="symbol-btn" aria-pressed="false" onclick="selectSymbol('${s.char}', '${s.name}')">
                      ${s.char}
                      <span class="symbol-btn__name">${s.name}</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Color -->
            <div class="config-block">
              <div class="config-block__title">Fadenfarbe</div>
              <div class="color-swatches" id="color-swatches">
                ${THREAD_COLORS.map(c => `
                  <button type="button" class="color-swatch" aria-pressed="false" onclick="selectColor('${c.name}', '${c.hex}')">
                    <span class="color-swatch__circle"
                         style="background:${c.hex};${c.border ? 'outline:1px solid '+c.border : ''}"></span>
                    <span class="color-swatch__name">${c.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>

          </div>

          <!-- CTA -->
          <div class="product-cta">
            <div class="personalize-hint" id="personalize-hint" role="status">
              Gib deinen Text ein und wähle eine Farbe.
            </div>
            <div class="qty-selector">
              <button class="qty-btn" aria-label="Menge verringern" onclick="changeQty(-1)">−</button>
              <span id="qty-display" aria-live="polite">1</span>
              <button class="qty-btn" aria-label="Menge erhöhen" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn btn--primary" id="add-btn" onclick="handleAddToCart()"
                    style="width:auto;padding:15px 32px;" disabled>
              Personalisiert in den Warenkorb
            </button>
          </div>

        </div>
      `;

      // Render initial canvas after DOM is ready
      requestAnimationFrame(() => { renderCanvas(); setupCanvasDrag(); });
    }

    // ── CANVAS ───────────────────────────────────────────────

    function renderCanvas() {
      const canvas = document.getElementById('cfg-canvas');
      if (!canvas) return;
      const W = canvas.width, H = canvas.height;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, W, H);

      // Hintergrund: echtes Produktfoto (cover), sonst Farbfläche als Fallback
      if (productImgReady && productImg) {
        const iw = productImg.naturalWidth, ih = productImg.naturalHeight;
        const scale = Math.max(W / iw, H / ih);
        const dw = iw * scale, dh = ih * scale;
        ctx.drawImage(productImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
      } else {
        ctx.fillStyle = PRODUCT_COLORS[productType] || '#F2EDDC';
        ctx.fillRect(0, 0, W, H);
        if (currentProduct?.image_url) {
          ctx.fillStyle = '#b0a898';
          ctx.font = `600 ${W * 0.03}px 'Source Sans 3', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Foto wird geladen…', W / 2, H / 2);
        }
      }

      const content = getContent();
      const px = cfg.pos.x * W;
      const py = cfg.pos.y * H;

      if (content && cfg.color) {
        const isSymbol = cfg.tab === 'symbol';
        const fontFamily = isSymbol ? 'sans-serif' : cfg.font.family;
        const fontSize = isSymbol
          ? W * 0.11
          : (content.length <= 3 ? W * 0.1 : content.length <= 8 ? W * 0.065 : W * 0.048);

        ctx.font = `700 ${fontSize}px ${fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Weicher heller Schein für Lesbarkeit auf beliebigem Foto
        ctx.save();
        ctx.lineWidth = fontSize * 0.14;
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineJoin = 'round';
        ctx.strokeText(content, px, py);
        ctx.restore();

        // Der eigentliche Text in Garnfarbe, mit dezentem Schatten
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.28)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;
        ctx.fillStyle = cfg.color.hex;
        ctx.fillText(content, px, py);
        ctx.restore();
      } else {
        // Noch kein Text/Farbe: dezenter Zieh-Marker an der aktuellen Position
        ctx.save();
        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = 'rgba(168,93,79,0.9)';
        ctx.lineWidth = 2;
        ctx.strokeRect(px - W * 0.16, py - H * 0.07, W * 0.32, H * 0.14);
        ctx.restore();
        ctx.fillStyle = '#a85d4f';
        ctx.font = `700 ${W * 0.028}px 'Source Sans 3', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Hier kommt dein Text', px, py);
      }
    }

    // ── DRAG & DROP: Text auf dem Foto platzieren ─────────────
    let dragging = false;

    function canvasPointToNorm(canvas, clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) / rect.width;
      const y = (clientY - rect.top) / rect.height;
      return {
        x: Math.min(0.9, Math.max(0.1, x)),
        y: Math.min(0.92, Math.max(0.08, y)),
      };
    }

    function setupCanvasDrag() {
      const canvas = document.getElementById('cfg-canvas');
      if (!canvas || canvas.dataset.dragWired) return;
      canvas.dataset.dragWired = '1';

      const move = (e) => {
        if (!dragging) return;
        e.preventDefault();
        cfg.pos = canvasPointToNorm(canvas, e.clientX, e.clientY);
        renderCanvas();
      };
      canvas.addEventListener('pointerdown', (e) => {
        dragging = true;
        canvas.setPointerCapture(e.pointerId);
        cfg.pos = canvasPointToNorm(canvas, e.clientX, e.clientY);
        renderCanvas();
      });
      canvas.addEventListener('pointermove', move);
      canvas.addEventListener('pointerup', () => { dragging = false; });
      canvas.addEventListener('pointercancel', () => { dragging = false; });
    }

    function getContent() {
      return cfg.tab === 'text' ? (cfg.text || null) : (cfg.symbol?.char || null);
    }

    // ── SELECTIONS ────────────────────────────────────────────

    function switchTab(tab) {
      cfg.tab = tab;
      cfg.text = '';
      cfg.symbol = null;
      document.getElementById('tab-text').classList.toggle('active', tab === 'text');
      document.getElementById('tab-symbol').classList.toggle('active', tab === 'symbol');
      document.getElementById('tab-text').setAttribute('aria-pressed', tab === 'text');
      document.getElementById('tab-symbol').setAttribute('aria-pressed', tab === 'symbol');
      document.getElementById('panel-text').classList.toggle('active', tab === 'text');
      document.getElementById('panel-symbol').classList.toggle('active', tab === 'symbol');
      if (tab === 'text') {
        const inp = document.getElementById('custom-text');
        if (inp) inp.value = '';
        const cc = document.getElementById('char-count');
        if (cc) cc.textContent = '0 / 20';
      }
      renderCanvas();
      checkReady();
    }

    function onTextInput(input) {
      cfg.text = input.value;
      const count = input.value.length;
      const cc = document.getElementById('char-count');
      if (cc) {
        cc.textContent = `${count} / 20`;
        cc.classList.toggle('warn', count > 15);
      }
      renderCanvas();
      checkReady();
    }

    function selectFont(id) {
      cfg.font = FONTS.find(f => f.id === id) || FONTS[0];
      document.querySelectorAll('.font-pill').forEach(el => {
        el.classList.toggle('selected', el.onclick?.toString().includes(`'${id}'`));
      });
      // Re-render font pills to update selected state
      const fp = document.getElementById('font-pills');
      if (fp) fp.innerHTML = FONTS.map(f => `
        <button class="font-pill ${f.id === cfg.font.id ? 'selected' : ''}"
                style="font-family:${f.family}" aria-pressed="${f.id === cfg.font.id}"
                onclick="selectFont('${f.id}')">${f.name}</button>
      `).join('');
      renderCanvas();
    }

    function selectSymbol(char, name) {
      cfg.symbol = { char, name };
      const sg = document.getElementById('symbol-grid');
      if (sg) sg.innerHTML = SYMBOLS.map(s => `
        <button type="button" class="symbol-btn ${s.char === char ? 'selected' : ''}"
             aria-pressed="${s.char === char}"
             onclick="selectSymbol('${s.char}', '${s.name}')">
          ${s.char}
          <span class="symbol-btn__name">${s.name}</span>
        </button>
      `).join('');
      renderCanvas();
      checkReady();
    }

    function selectColor(name, hex) {
      cfg.color = { name, hex };
      const cs = document.getElementById('color-swatches');
      if (cs) cs.innerHTML = THREAD_COLORS.map(c => `
        <button type="button" class="color-swatch ${c.name === name ? 'selected' : ''}"
             aria-pressed="${c.name === name}"
             onclick="selectColor('${c.name}', '${c.hex}')">
          <span class="color-swatch__circle"
               style="background:${c.hex};${c.border ? 'outline:1px solid '+c.border : ''}"></span>
          <span class="color-swatch__name">${c.name}</span>
        </button>
      `).join('');
      renderCanvas();
      checkReady();
    }

    // ── VALIDATION ────────────────────────────────────────────

    function checkReady() {
      const content = getContent();
      const ready = !!(content && cfg.color);
      const btn = document.getElementById('add-btn');
      const hint = document.getElementById('personalize-hint');
      if (btn) btn.disabled = !ready;
      if (hint) {
        if (ready) {
          hint.className = 'personalize-hint complete';
          hint.textContent = `Bereit: „${content}" · Faden: ${cfg.color.name} — zieh den Text an die gewünschte Stelle.`;
        } else {
          hint.className = 'personalize-hint';
          const missing = [];
          if (!content) missing.push('Text oder Symbol');
          if (!cfg.color) missing.push('Farbe');
          hint.textContent = `Noch ausstehend: ${missing.join(', ')}`;
        }
      }
    }

    // ── CART ──────────────────────────────────────────────────

    function changeQty(delta) {
      qty = Math.max(1, Math.min(qty + delta, currentProduct?.stock || 99));
      const el = document.getElementById('qty-display');
      if (el) el.textContent = qty;
    }

    function handleAddToCart() {
      if (!currentProduct || !cfg.color) return;
      const content = getContent();
      if (!content) return;

      // Vorschau als Warenkorb-Bild einfrieren (zeigt das fertige, personalisierte Produkt)
      let previewUrl = currentProduct.image_url || null;
      try {
        previewUrl = document.getElementById('cfg-canvas').toDataURL('image/png');
      } catch (_) { /* Foto ohne CORS-Freigabe → Basisbild als Fallback */ }

      // Personalisierung über das bestehende Options-System (fließt in Warenkorb & Bestellung)
      const options = {
        'Text': content,
        [cfg.tab === 'text' ? 'Schriftart' : 'Symbol']:
          cfg.tab === 'text' ? cfg.font.name : (cfg.symbol?.name || content),
        'Farbe': cfg.color.name,
        'Position': `${Math.round(cfg.pos.x * 100)}% / ${Math.round(cfg.pos.y * 100)}%`,
      };

      const base = { ...currentProduct, image_url: previewUrl };
      for (let i = 0; i < qty; i++) addToCart(base, options);
    }

    init();
  </script>

</body>
