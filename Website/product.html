<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produkt — MADE2MEANT</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    .product-detail {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      padding: 60px 0 80px;
      align-items: start;
    }

    /* LINKS: Live-Vorschau */
    .product-visual { position: sticky; top: 90px; }
    .preview-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
    }
    .preview-wrap canvas {
      width: 100%; height: auto; display: block;
      touch-action: none; cursor: grab;
    }
    .preview-wrap canvas:active { cursor: grabbing; }
    .view-tabs { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .view-tab {
      padding: 7px 14px; border: 1px solid var(--color-border); border-radius: 99px;
      background: #fff; color: var(--color-text); font-family: var(--font-main);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em; cursor: pointer;
      transition: all 0.15s;
    }
    .view-tab:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .view-tab.active { background: var(--color-text); border-color: var(--color-text); color: #F2EDDC; }
    .preview-hint {
      text-align: center; font-size: 0.72rem; color: var(--color-muted);
      font-weight: 600; letter-spacing: 0.06em; margin-top: 10px;
    }

    /* RECHTS: Info + Konfigurator */
    .product-info { display: flex; flex-direction: column; }
    .product-info__category {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--color-primary); margin-bottom: 8px;
    }
    .product-info__title { font-size: 2rem; margin-bottom: 10px; line-height: 1.2; }
    .product-info__desc { color: var(--color-muted); line-height: 1.8; font-size: 0.95rem; margin-bottom: 8px; }
    .product-info__stock { font-size: 0.82rem; color: var(--color-muted); }
    .product-info__stock.low { color: #e07b2a; }

    .cfg { margin-top: 28px; border-top: 1px solid var(--color-border); padding-top: 28px; }
    .cfg-block { margin-bottom: 26px; }
    .cfg-block__title {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--color-text); margin-bottom: 6px;
    }
    .cfg-block__hint { font-size: 0.78rem; color: var(--color-muted); margin-bottom: 12px; }

    .cfg-select {
      width: 100%; padding: 11px 14px;
      border: 1px solid var(--color-border); border-radius: var(--radius);
      font-family: var(--font-main); font-size: 0.95rem;
      color: var(--color-text); background: #fff; cursor: pointer;
    }
    .cfg-select:focus { border-color: var(--color-primary); }
    .thread-row { display: flex; align-items: center; gap: 12px; }
    .thread-row .cfg-select { flex: 1; }
    .thread-dot {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15); flex: 0 0 auto; background: transparent;
    }

    .pos-list { display: flex; flex-direction: column; gap: 10px; }
    .pos-card {
      border: 1.5px solid var(--color-border); border-radius: var(--radius);
      padding: 14px 16px; transition: border-color 0.15s, background 0.15s;
    }
    .pos-card.active { border-color: var(--color-primary); background: #fdf8f7; }
    .pos-card__head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .pos-card__head input { width: 18px; height: 18px; accent-color: var(--color-primary); cursor: pointer; }
    .pos-card__name { font-weight: 700; flex: 1; font-size: 0.92rem; }
    .pos-card__price { color: var(--color-primary); font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
    .pos-text { margin-top: 12px; display: none; }
    .pos-text label { display: block; font-size: 0.78rem; color: var(--color-muted); margin-bottom: 5px; }
    .pos-text input {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--color-border); border-radius: var(--radius);
      font-family: var(--font-main); font-size: 0.95rem; color: var(--color-text); background: #fff;
    }
    .pos-text input:focus { border-color: var(--color-primary); }

    .price-summary { display: flex; align-items: baseline; gap: 12px; margin: 8px 0 18px; flex-wrap: wrap; }
    .price-display { font-size: 1.8rem; font-weight: 900; color: var(--color-primary); }
    .price-note { font-size: 0.8rem; color: var(--color-muted); }
    .personalize-hint {
      font-size: 0.82rem; color: var(--color-muted);
      padding: 10px 14px; background: #fdf8f7; border: 1px solid #f0e4e2;
      border-radius: var(--radius); margin-bottom: 12px;
    }
    .personalize-hint.complete { background: #f0f7f2; border-color: #c8dece; color: var(--color-accent); }
    .qty-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .qty-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: #fff; border: 1px solid var(--color-border);
      color: var(--color-text); font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { border-color: var(--color-primary); }
    #qty-display { font-size: 1.05rem; font-weight: 600; min-width: 22px; text-align: center; }

    @media (max-width: 768px) {
      .product-detail { grid-template-columns: 1fr; gap: 32px; }
      .product-visual { position: static; }
    }
  </style>
</head>
<body>


  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <nav class="navbar">
    <div class="container navbar__inner">
      <a href="/index.html" class="navbar__logo">MADE2<span>MEANT</span></a>
      <ul class="navbar__links">
        <li><a href="/index.html">← Shop</a></li>
        <li><a href="/login.html" id="nav-login">Login</a></li>
        <li><a href="/account.html" id="nav-account" style="display:none">Mein Konto</a></li>
        <li><button class="btn btn--ghost" id="nav-logout" style="display:none" onclick="logout()">Logout</button></li>
        <li><a href="/cart.html" class="cart-icon" aria-label="Warenkorb"><span aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v13a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span> <span id="cart-badge" style="display:none">0</span></a></li>
      </ul>
    </div>

  <main id="main">
    <div class="container">
      <div id="product-detail" class="product-detail">
        <p class="loading">Produkt wird geladen...</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="footer__copy">© 2026 MADE2MEANT. Alle Rechte vorbehalten.</span>
      <ul class="footer__links">
        <li><a href="/impressum.html">Impressum</a></li>
        <li><a href="/datenschutz.html">Datenschutz</a></li>
        <li><a href="/agb.html">AGB</a></li>
      </ul>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/products.js"></script>

  <script>
    updateNav();
    updateCartBadge();

    // ── DATEN ─────────────────────────────────────────────────
    const THREAD_COLORS = [
      { name: 'Weiß', hex: '#F0EDE8' }, { name: 'Schwarz', hex: '#1a1a1a' },
      { name: 'Navy', hex: '#1B2A4A' }, { name: 'Bordeaux', hex: '#7B1C2E' },
      { name: 'Terracotta', hex: '#a85d4f' }, { name: 'Moosgrün', hex: '#42553d' },
      { name: 'Gold', hex: '#C9A84C' }, { name: 'Silber', hex: '#A8A9AD' },
      { name: 'Rosa', hex: '#D4789E' }, { name: 'Hellblau', hex: '#5B9EC9' },
      { name: 'Beige', hex: '#C4A882' }, { name: 'Lila', hex: '#7B5EA7' },
    ];

    // Stickstellen werden pro Produkt im Admin definiert (product.positions)
    let POSITIONS = [];

    // ── STATE ─────────────────────────────────────────────────
    let currentProduct = null;
    let productImages = [];
    let capOption = null;
    let qty = 1;

    const cfg = {
      capColor: null,
      threadColor: null,          // {name,hex}
      positions: {},              // id -> { text, pos:{x,y} }
      previewPos: null,           // aktuell gezeigte Stelle (id)
    };

    const imgCache = {};
    function getImg(url) {
      if (!url) return null;
      if (url in imgCache) return imgCache[url];
      const im = new Image();
      im.onload = () => renderCanvas();
      im.onerror = () => { imgCache[url] = null; };
      im.src = url;
      imgCache[url] = im;
      return im;
    }

    // ── INIT ──────────────────────────────────────────────────
    async function init() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      if (!slug) { window.location.href = '/index.html'; return; }

      currentProduct = await loadProduct(slug);
      if (!currentProduct) {
        document.getElementById('product-detail').innerHTML = '<p class="empty">Produkt nicht gefunden.</p>';
        return;
      }
      document.title = currentProduct.name + ' — MADE2MEANT';

      const { data: imgs } = await db.from('product_images')
        .select('url, option_values, sort_order')
        .eq('product_id', currentProduct.id)
        .order('sort_order');
      productImages = imgs || [];

      const opts = currentProduct.options || [];
      capOption = opts.find(o => /kappe|farbe/i.test(o.name)) || null;
      if (capOption && capOption.values?.length) cfg.capColor = capOption.values[0];

      // Stickstellen aus dem Produkt laden
      POSITIONS = (currentProduct.positions || []).map((p, i) => ({
        id: 'p' + i, label: p.label, view: p.label,
        price: Number(p.price) || 0, def: { x: 0.5, y: 0.45 },
      }));
      cfg.previewPos = POSITIONS[0]?.id || null;

      renderPage();
    }

    // ── HELFER ────────────────────────────────────────────────
    function euro(n) { return '€ ' + Number(n).toFixed(2).replace('.', ','); }

    // Foto für eine Ansicht (view) + aktuelle Kappenfarbe finden
    function photoFor(positionId) {
      const p = POSITIONS.find(x => x.id === positionId);
      const view = p ? p.view : null;
      const hasColor = (ov) => !cfg.capColor || Object.values(ov || {}).includes(cfg.capColor);
      const hasView  = (ov) => Object.values(ov || {}).includes(view);

      // 1. exakt: passende Ansicht + Farbe
      let m = productImages.find(img => hasView(img.option_values) && hasColor(img.option_values));
      // 2. nur passende Farbe (ein Foto der Farbe)
      if (!m) m = productImages.find(img => hasColor(img.option_values));
      // 3. irgendein Foto / Hauptbild
      return m?.url || currentProduct.image_url || '/assets/images/placeholder.png';
    }

    function currentPrice() {
      const base = Number(currentProduct.price) || 0;
      const add = POSITIONS.filter(p => p.id in cfg.positions).reduce((s, p) => s + p.price, 0);
      return base + add;
    }

    // ── RENDER SEITE ──────────────────────────────────────────
    function renderPage() {
      const p = currentProduct;
      const stockLabel = p.stock <= 5
        ? `<span class="product-info__stock low">Nur noch ${p.stock} verfügbar</span>`
        : `<span class="product-info__stock">${p.stock} auf Lager</span>`;

      const personalizable = POSITIONS.length > 0;

      const capBlock = (capOption && capOption.values?.length) ? `
        <div class="cfg-block">
          <div class="cfg-block__title">Farbe</div>
          <select class="cfg-select" id="cap-select" onchange="selectCap(this.value)" aria-label="Farbe wählen">
            ${capOption.values.map(v => `<option value="${v}" ${v === cfg.capColor ? 'selected' : ''}>${v}</option>`).join('')}
          </select>
        </div>` : '';

      const posBlock = !personalizable ? '' : `
        <div class="cfg-block">
          <div class="cfg-block__title">Stickstellen</div>
          <div class="cfg-block__hint">Wähle eine oder mehrere Stellen — dein Text erscheint live in der Vorschau.</div>
          <div class="pos-list">
            ${POSITIONS.map(pos => `
              <div class="pos-card" id="poscard-${pos.id}">
                <label class="pos-card__head">
                  <input type="checkbox" onchange="togglePosition('${pos.id}', this.checked)">
                  <span class="pos-card__name">${pos.label}</span>
                  <span class="pos-card__price">+ ${euro(pos.price)}</span>
                </label>
                <div class="pos-text" id="postext-${pos.id}">
                  <label for="posinput-${pos.id}">Dein Text für diese Stelle</label>
                  <input type="text" id="posinput-${pos.id}" maxlength="24"
                         placeholder="z.B. Emma, 2026, Kleiner Schatz"
                         onfocus="setPreview('${pos.id}')"
                         oninput="setPositionText('${pos.id}', this.value)">
                </div>
              </div>
            `).join('')}
          </div>
        </div>`;

      const threadBlock = !personalizable ? '' : `
        <div class="cfg-block">
          <div class="cfg-block__title">Fadenfarbe</div>
          <div class="thread-row">
            <select class="cfg-select" id="thread-select" onchange="selectThread(this.value)" aria-label="Fadenfarbe wählen">
              <option value="">Bitte wählen…</option>
              ${THREAD_COLORS.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
            </select>
            <span class="thread-dot" id="thread-dot"></span>
          </div>
        </div>`;

      const priceNote = personalizable
        ? `Grundpreis${p.price ? ' ' + euro(p.price) : ''} + gewählte Stickstellen`
        : '';
      const startHint = personalizable
        ? 'Wähle mindestens eine Stickstelle mit Text und eine Fadenfarbe.'
        : '';

      document.getElementById('product-detail').innerHTML = `
        <div class="product-visual">
          <div class="preview-wrap">
            <canvas id="cfg-canvas" width="560" height="560" role="img" aria-label="Live-Vorschau des Produkts"></canvas>
          </div>
          <div class="view-tabs" id="view-tabs"></div>
          ${personalizable ? '<div class="preview-hint" id="preview-hint">Wähle eine Stickstelle und tippe deinen Text.</div>' : ''}
        </div>

        <div class="product-info">
          <div class="product-info__category">${personalizable ? 'Individuell bestickt' : 'Produkt'}</div>
          <h1 class="product-info__title">${p.name}</h1>
          <p class="product-info__desc">${p.description || ''}</p>
          ${stockLabel}

          <div class="cfg">
            ${capBlock}
            ${posBlock}
            ${threadBlock}

            <div class="price-summary">
              <span class="price-display" id="price-display">${euro(currentPrice())}</span>
              <span class="price-note" id="price-note">${priceNote}</span>
            </div>

            ${personalizable ? `<div class="personalize-hint" id="hint" role="status">${startHint}</div>` : '<div id="hint"></div>'}

            <div class="qty-selector">
              <button class="qty-btn" aria-label="Menge verringern" onclick="changeQty(-1)">−</button>
              <span id="qty-display" aria-live="polite">1</span>
              <button class="qty-btn" aria-label="Menge erhöhen" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn btn--primary" id="add-btn" onclick="handleAddToCart()"
                    style="width:auto;padding:15px 32px;" ${personalizable ? 'disabled' : ''}>
              ${personalizable ? 'Personalisiert in den Warenkorb' : 'In den Warenkorb'}
            </button>
          </div>
        </div>
      `;

      renderViewTabs();
      requestAnimationFrame(() => { renderCanvas(); setupCanvasDrag(); });
    }

    // ── VORSCHAU (Canvas) ─────────────────────────────────────
    function renderCanvas() {
      const canvas = document.getElementById('cfg-canvas');
      if (!canvas) return;
      const W = canvas.width, H = canvas.height, ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, W, H);

      const view = cfg.previewPos;
      const img = getImg(photoFor(view));
      if (img && img.complete && img.naturalWidth) {
        const scale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
        const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
        ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      } else {
        ctx.fillStyle = '#EDE8DF'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#b0a898';
        ctx.font = `600 ${W * 0.03}px 'Source Sans 3', sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Foto wird geladen…', W / 2, H / 2);
      }

      const data = cfg.positions[view];
      if (data && data.text && cfg.threadColor) {
        const px = data.pos.x * W, py = data.pos.y * H;
        const t = data.text;
        const fontSize = t.length <= 3 ? W * 0.1 : t.length <= 8 ? W * 0.07 : W * 0.05;
        ctx.font = `700 ${fontSize}px 'Source Sans 3', sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        // heller Rand für Lesbarkeit
        ctx.save();
        ctx.lineWidth = fontSize * 0.14; ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineJoin = 'round';
        ctx.strokeText(t, px, py); ctx.restore();
        // Text in Garnfarbe
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = 3; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1;
        ctx.fillStyle = cfg.threadColor.hex; ctx.fillText(t, px, py); ctx.restore();
      } else if (data) {
        const px = data.pos.x * W, py = data.pos.y * H;
        ctx.save();
        ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(168,93,79,0.9)'; ctx.lineWidth = 2;
        ctx.strokeRect(px - W * 0.16, py - H * 0.06, W * 0.32, H * 0.12); ctx.restore();
        ctx.fillStyle = '#a85d4f'; ctx.font = `700 ${W * 0.026}px 'Source Sans 3', sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Hier kommt dein Text', px, py);
      }
    }

    function renderViewTabs() {
      const tabs = document.getElementById('view-tabs');
      if (!tabs) return;
      const active = POSITIONS.filter(p => p.id in cfg.positions);
      if (active.length <= 1) { tabs.innerHTML = ''; return; }
      tabs.innerHTML = active.map(p =>
        `<button class="view-tab ${p.id === cfg.previewPos ? 'active' : ''}" onclick="setPreview('${p.id}')">${p.view}</button>`
      ).join('');
    }

    // Drag: Text auf dem Foto verschieben
    let dragging = false;
    function normPoint(canvas, cx, cy) {
      const r = canvas.getBoundingClientRect();
      return {
        x: Math.min(0.9, Math.max(0.1, (cx - r.left) / r.width)),
        y: Math.min(0.92, Math.max(0.08, (cy - r.top) / r.height)),
      };
    }
    function setupCanvasDrag() {
      const canvas = document.getElementById('cfg-canvas');
      if (!canvas || canvas.dataset.wired) return;
      canvas.dataset.wired = '1';
      const apply = (e) => {
        const d = cfg.positions[cfg.previewPos];
        if (!d) return;
        d.pos = normPoint(canvas, e.clientX, e.clientY);
        renderCanvas();
      };
      canvas.addEventListener('pointerdown', (e) => {
        if (!cfg.positions[cfg.previewPos]) return;
        dragging = true; canvas.setPointerCapture(e.pointerId); apply(e);
      });
      canvas.addEventListener('pointermove', (e) => { if (dragging) { e.preventDefault(); apply(e); } });
      canvas.addEventListener('pointerup', () => { dragging = false; });
      canvas.addEventListener('pointercancel', () => { dragging = false; });
    }

    // ── AUSWAHL ───────────────────────────────────────────────
    function selectCap(value) { cfg.capColor = value; renderCanvas(); }

    function selectThread(name) {
      cfg.threadColor = THREAD_COLORS.find(t => t.name === name) || null;
      document.getElementById('thread-dot').style.background = cfg.threadColor ? cfg.threadColor.hex : 'transparent';
      renderCanvas(); checkReady();
    }

    function setPreview(id) {
      cfg.previewPos = id;
      renderViewTabs();
      renderCanvas();
    }

    function togglePosition(id, on) {
      if (on) {
        if (!(id in cfg.positions)) {
          const def = POSITIONS.find(p => p.id === id).def;
          cfg.positions[id] = { text: '', pos: { x: def.x, y: def.y } };
        }
        cfg.previewPos = id;
      } else {
        delete cfg.positions[id];
        if (cfg.previewPos === id) {
          const remaining = POSITIONS.find(p => p.id in cfg.positions);
          cfg.previewPos = remaining ? remaining.id : (POSITIONS[0]?.id || null);
        }
      }
      document.getElementById('poscard-' + id).classList.toggle('active', on);
      document.getElementById('postext-' + id).style.display = on ? 'block' : 'none';
      if (on) { const inp = document.getElementById('posinput-' + id); if (inp) inp.focus(); }
      renderViewTabs(); renderCanvas(); updatePrice(); checkReady();
    }

    function setPositionText(id, val) {
      if (cfg.positions[id]) cfg.positions[id].text = val;
      renderCanvas(); checkReady();
    }

    function updatePrice() {
      document.getElementById('price-display').textContent = euro(currentPrice());
    }

    function changeQty(delta) {
      qty = Math.max(1, Math.min(qty + delta, currentProduct?.stock || 99));
      document.getElementById('qty-display').textContent = qty;
    }

    // ── VALIDIERUNG ───────────────────────────────────────────
    function checkReady() {
      const btn = document.getElementById('add-btn');
      const hint = document.getElementById('hint');
      const capOk = !capOption || !!cfg.capColor;

      // Produkt ohne Stickstellen: einfaches Produkt, immer kaufbar (Farbe ggf. nötig)
      if (POSITIONS.length === 0) { if (btn) btn.disabled = !capOk; return; }

      const active = Object.keys(cfg.positions);
      const allFilled = active.length > 0 && active.every(id => (cfg.positions[id].text || '').trim());
      const ready = allFilled && !!cfg.threadColor && capOk;
      if (btn) btn.disabled = !ready;
      if (!hint) return;

      if (ready) {
        const parts = active.map(id => `${POSITIONS.find(p => p.id === id).label}: „${cfg.positions[id].text}"`);
        hint.className = 'personalize-hint complete';
        hint.textContent = `Bereit — ${parts.join(' · ')} · Faden: ${cfg.threadColor.name}`;
      } else {
        hint.className = 'personalize-hint';
        const missing = [];
        if (!active.length) missing.push('mindestens eine Stickstelle');
        else if (!allFilled) missing.push('Text für jede gewählte Stelle');
        if (!cfg.threadColor) missing.push('Fadenfarbe');
        if (capOption && !cfg.capColor) missing.push('Farbe');
        hint.textContent = `Noch offen: ${missing.join(', ')}.`;
      }
    }

    // ── WARENKORB ─────────────────────────────────────────────
    function handleAddToCart() {
      const options = {};
      if (capOption) options[capOption.name] = cfg.capColor;

      if (POSITIONS.length > 0) {
        const active = Object.keys(cfg.positions);
        if (!active.length || !cfg.threadColor) return;
        options['Fadenfarbe'] = cfg.threadColor.name;
        POSITIONS.forEach(p => { if (p.id in cfg.positions) options[p.label] = cfg.positions[p.id].text; });
      }

      let previewUrl = photoFor(cfg.previewPos);
      try { previewUrl = document.getElementById('cfg-canvas').toDataURL('image/png'); } catch (_) {}

      const base = { ...currentProduct, price: currentPrice(), image_url: previewUrl };
      for (let i = 0; i < qty; i++) addToCart(base, options);
    }

    init();
  </script>

</body>
